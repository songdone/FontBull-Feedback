name: 使用问题
description: 报告安装、启用、预览、下载或其他使用问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "反馈公开可见。请先搜索已有问题，不要上传密码、令牌、配对码、完整配置或未经许可的字体文件。"
  - type: input
    id: app-version
    attributes:
      label: 字牛版本
      placeholder: "例如：1.1.1"
    validations:
      required: true
  - type: input
    id: fnos-version
    attributes:
      label: fnOS 版本
      placeholder: "请填写系统中显示的版本号"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: 设备架构
      options:
        - x86 / x86_64
        - ARM / ARM64
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 安装来源
      options:
        - 飞牛应用中心
        - 手动安装 FPK
        - 本地运行
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: "从哪里打开、点击了什么、在哪一步出现问题？"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期结果
      description: "请保留错误提示的原文。"
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 截图或必要的日志片段
      description: "可拖入截图；请遮盖私人路径、项目名称和个人信息，不要上传完整日志或配置。"
